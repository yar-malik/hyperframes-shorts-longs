    </g>
    <rect x="50" y="1160" width="980" height="92" rx="16" fill="#FF5A1F"/><text x="78" y="1200" fill="#fff" font-family="Arial" font-size="18" font-weight="900" letter-spacing="1.5">MY STOP RULE</text><text x="78" y="1230" fill="#fff" font-family="Arial" font-size="22" font-weight="900">All critical checks pass — or max 3 rounds.</text><text x="50" y="1310" fill="#AAB6C5" font-family="Arial" font-size="14" font-weight="900" letter-spacing="1.8">CLAUDECODEXMASTERY.SPACE</text><text x="1030" y="1310" fill="#FFFDF8" font-family="Arial" font-size="17" font-weight="900" text-anchor="end">SWIPE →</text></svg>