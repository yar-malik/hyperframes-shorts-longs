      <g><circle cx="155" cy="160" r="94" fill="#10253E" stroke="#1877F2" stroke-width="6"/><text x="155" y="169" fill="#FFFDF8" font-family="Arial" font-size="27" font-weight="900" text-anchor="middle">BUILD</text></g><g><circle cx="490" cy="160" r="94" fill="#10253E" stroke="#FFFDF8" stroke-width="6"/><text x="490" y="169" fill="#FFFDF8" font-family="Arial" font-size="27" font-weight="900" text-anchor="middle">REVIEW</text></g><g><circle cx="825" cy="160" r="94" fill="#10253E" stroke="#FF5A1F" stroke-width="6"/><text x="825" y="169" fill="#FFFDF8" font-family="Arial" font-size="27" font-weight="900" text-anchor="middle">PATCH</text></g><g><circle cx="490" cy="445" r="94" fill="#10253E" stroke="#62D6FF" stroke-width="6"/><text x="490" y="454" fill="#FFFDF8" font-family="Arial" font-size="27" font-weight="900" text-anchor="middle">PASS?</text></g>
      <path d="M254 160H386 M594 160H721 M825 260 C825 445 690 445 590 445 M390 445 C260 445 155 350 155 260" fill="none" stroke="#5B7695" stroke-width="9" stroke-linecap="round"/>
