    <text x="50" y="225" fill="#FFFDF8" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" text-anchor="start">Build → score →</text><text x="50" y="315" fill="#FF5A1F" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" text-anchor="start">patch → repeat.</text>
    <text x="54" y="408" fill="#AAB6C5" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start">Set the pass rule before you start.</text>
